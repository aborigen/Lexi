<svg viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="540" y1="0" x2="540" y2="1920" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4FC3F7" />
      <stop offset="40%" stop-color="#B3E5FC" />
      <stop offset="100%" stop-color="#E1F5FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#sky)" />
  <circle cx="1000" cy="80" r="300" fill="white" fill-opacity="0.3" filter="url(#glow)" />
  
  <!-- Word Slots -->
  <rect x="100" y="200" width="880" height="400" rx="40" fill="white" fill-opacity="0.4" stroke="white" stroke-width="4" />
  <g transform="translate(140, 250)">
    <rect width="80" height="80" rx="10" fill="#FFB300" stroke="white" stroke-width="2" />
    <text x="40" y="55" font-family="sans-serif" font-weight="900" font-size="40" fill="white" text-anchor="middle">S</text>
    <rect x="90" width="80" height="80" rx="10" fill="#FFB300" stroke="white" stroke-width="2" />
    <text x="130" y="55" font-family="sans-serif" font-weight="900" font-size="40" fill="white" text-anchor="middle">T</text>
    <rect x="180" width="80" height="80" rx="10" fill="#FFB300" stroke="white" stroke-width="2" />
    <text x="220" y="55" font-family="sans-serif" font-weight="900" font-size="40" fill="white" text-anchor="middle">A</text>
    <rect x="270" width="80" height="80" rx="10" fill="#FFB300" stroke="white" stroke-width="2" />
    <text x="310" y="55" font-family="sans-serif" font-weight="900" font-size="40" fill="white" text-anchor="middle">R</text>
  </g>
  
  <!-- Letter Circle -->
  <circle cx="540" cy="1400" r="350" fill="white" fill-opacity="0.2" stroke="white" stroke-width="4" />
  <g filter="url(#glow)">
    <circle cx="540" cy="1050" r="70" fill="white" stroke="#FFB300" stroke-width="4" />
    <text x="540" y="1065" font-family="sans-serif" font-weight="900" font-size="40" fill="#333" text-anchor="middle">S</text>
    <circle cx="890" cy="1400" r="70" fill="white" stroke="#FFB300" stroke-width="4" />
    <text x="890" y="1415" font-family="sans-serif" font-weight="900" font-size="40" fill="#333" text-anchor="middle">T</text>
    <circle cx="715" cy="1703" r="70" fill="white" stroke="#FFB300" stroke-width="4" />
    <text x="715" y="1718" font-family="sans-serif" font-weight="900" font-size="40" fill="#333" text-anchor="middle">A</text>
    <circle cx="365" cy="1703" r="70" fill="white" stroke="#FFB300" stroke-width="4" />
    <text x="365" y="1718" font-family="sans-serif" font-weight="900" font-size="40" fill="#333" text-anchor="middle">R</text>
    <circle cx="190" cy="1400" r="70" fill="white" stroke="#FFB300" stroke-width="4" />
    <text x="190" y="1415" font-family="sans-serif" font-weight="900" font-size="40" fill="#333" text-anchor="middle">E</text>
  </g>

  <!-- Connection Line -->
  <path d="M 540 1050 L 890 1400 L 715 1703 L 365 1703" stroke="#FFB300" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- FAB -->
  <circle cx="950" cy="1780" r="80" fill="#FFB300" stroke="white" stroke-width="6" filter="url(#glow)" />
  <path d="M930 1760 L970 1800 M970 1760 L930 1800" stroke="white" stroke-width="8" stroke-linecap="round" />
</svg>