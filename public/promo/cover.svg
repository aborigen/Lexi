<svg width="800" height="470" viewBox="0 0 800 470" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="400" y1="0" x2="400" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="0.6" stop-color="#B3E5FC"/>
      <stop offset="1" stop-color="#E1F5FE"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 80) rotate(90) scale(140)">
      <stop offset="0" stop-color="#FFF176"/>
      <stop offset="0.5" stop-color="#FFD600"/>
      <stop offset="1" stop-color="#FFD600" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feOffset dx="2" dy="4" result="offsetBlur" />
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over" />
    </filter>
  </defs>
  
  <rect width="800" height="470" fill="url(#skyGrad)"/>
  
  <circle cx="720" cy="80" r="140" fill="url(#sunGrad)" opacity="0.6"/>
  
  <circle cx="80" cy="380" r="70" fill="white" fill-opacity="0.2"/>
  <circle cx="150" cy="400" r="50" fill="white" fill-opacity="0.2"/>
  <circle cx="700" cy="350" r="60" fill="white" fill-opacity="0.15"/>
  
  <text x="400" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-style="italic" font-size="80" fill="white" filter="url(#glow)">Lexi.AI</text>
  
  <g transform="translate(400, 290)">
    <circle cx="0" cy="0" r="120" stroke="white" stroke-opacity="0.2" stroke-width="4" fill="white" fill-opacity="0.05"/>
    
    <!-- Letter Ring (STAR) -->
    <!-- S -->
    <circle cx="-77.9" cy="-45" r="35" fill="white" filter="url(#softShadow)"/>
    <text x="-77.9" y="-35" text-anchor="middle" font-family="system-ui" font-weight="900" font-size="32" fill="#1F2937">S</text>
    
    <!-- T -->
    <circle cx="0" cy="-90" r="35" fill="#FFD600" filter="url(#glow)"/>
    <text x="0" y="-80" text-anchor="middle" font-family="system-ui" font-weight="900" font-size="32" fill="white">T</text>
    
    <!-- A -->
    <circle cx="77.9" cy="-45" r="35" fill="#FFD600" filter="url(#glow)"/>
    <text x="77.9" y="-35" text-anchor="middle" font-family="system-ui" font-weight="900" font-size="32" fill="white">A</text>
    
    <!-- R -->
    <circle cx="0" cy="90" r="35" fill="#FFD600" filter="url(#glow)"/>
    <text x="0" y="100" text-anchor="middle" font-family="system-ui" font-weight="900" font-size="32" fill="white">R</text>
    
    <!-- Glow Path T -> A -> R -->
    <path d="M 0 -90 L 77.9 -45 L 0 90" stroke="#FFD600" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
</svg>
