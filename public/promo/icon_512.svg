<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconSky" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#E1F5FE"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#iconSky)"/>
  
  <!-- Cloud shapes in corners -->
  <circle cx="450" cy="450" r="80" fill="white" fill-opacity="0.3"/>
  <circle cx="400" cy="480" r="60" fill="white" fill-opacity="0.3"/>
  
  <!-- The Link path -->
  <path d="M 120 380 C 80 200, 432 100, 392 280" stroke="#FFD600" stroke-width="28" stroke-linecap="round" filter="url(#iconGlow)" fill="none" />
  <circle cx="120" cy="380" r="22" fill="#FFD600" filter="url(#iconGlow)" />
  <circle cx="392" cy="280" r="22" fill="#FFD600" filter="url(#iconGlow)" />
  
  <!-- The Centered L -->
  <text x="256" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-style="italic" font-size="320" fill="#FFD600" filter="url(#iconGlow)">L</text>
</svg>
