<svg viewBox="0 0 800 470" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradRU" x1="0" y1="0" x2="0" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4FC3F7" />
      <stop offset="100%" stop-color="#E1F5FE" />
    </linearGradient>
    <filter id="glowRU" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="800" height="470" fill="url(#skyGradRU)" />
  
  <!-- Abstract Clouds -->
  <circle cx="100" cy="100" r="80" fill="white" fill-opacity="0.3" />
  <circle cx="700" cy="380" r="100" fill="white" fill-opacity="0.3" />
  <circle cx="750" cy="50" r="60" fill="white" fill-opacity="0.3" />
  
  <!-- Circular Game Mechanic Visual -->
  <circle cx="400" cy="235" r="180" stroke="white" stroke-width="2" stroke-dasharray="10 10" stroke-opacity="0.2" />
  
  <!-- Localized Branding -->
  <text x="400" y="240" font-family="system-ui, sans-serif" font-weight="900" font-size="120" fill="white" text-anchor="middle" filter="url(#glowRU)">Lexi.AI</text>
  <text x="400" y="320" font-family="system-ui, sans-serif" font-weight="700" font-size="32" fill="white" fill-opacity="0.8" text-anchor="middle">Лингвистическая Головоломка</text>
  
  <!-- Interactive Element Hint -->
  <path d="M300 400 L500 400" stroke="hsl(45 100% 50%)" stroke-width="12" stroke-linecap="round" filter="url(#glowRU)" />
  <circle cx="300" cy="400" r="15" fill="hsl(45 100% 50%)" filter="url(#glowRU)" />
  <circle cx="500" cy="400" r="15" fill="hsl(45 100% 50%)" filter="url(#glowRU)" />
</svg>